name: Workbench
options:
  bundleIdPrefix: com.linku
targets:
  Workbench:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Workbench]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linku.workbench
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: Workbench/Info.plist
      properties:
        NSHumanReadableCopyright: ""
        # Registers the bundled Inter faces at launch, so Theme.heading and
        # Theme.body resolve instead of silently falling back to the system font.
        # The value is "." because Xcode copies the .ttf files flat into
        # Contents/Resources rather than preserving the Resources/Fonts folder,
        # and this path is not searched recursively.
        ATSApplicationFontsPath: "."
  WorkbenchTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [WorkbenchTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Workbench
