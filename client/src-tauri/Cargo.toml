[package]
name = "tauri-client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
# Required once the crate gained the launchd_probe binary: `tauri dev` shells out to a
# bare `cargo run`, which then refuses with "could not determine which binary to run".
default-run = "tauri-client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Still no TLS features: the only host this ever talks to is 127.0.0.1 over plain HTTP,
# so pulling in rustls or native-tls would be build weight for nothing. `json` is needed
# now that the client sends request bodies.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# The LaunchAgent plist. Tauri already depends on this transitively, so it costs nothing
# extra to build.
plist = "1"
# The engine folder picker. NSOpenPanel is what ProjectFormSheet.swift and SettingsSheet
# use, and a webview has no such thing: a bare `<input type="file">` cannot pick a
# directory and gives back a sandboxed handle rather than a path, and the engine needs a
# real path to put in WorkingDirectory.
tauri-plugin-dialog = "2"

